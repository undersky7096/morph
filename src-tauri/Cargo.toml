[package]
name = "morph"
version = "1.0.0"
description = "Morph — convertisseur et éditeur de fichiers"
authors = ["UnderSkyDev"]
license = "GPL-3.0-or-later"
edition = "2024"
default-run = "morph"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "morph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico", "tga"] }
thiserror = "2.0.21"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
imagequant = "4"
png = "0.18"
# Détourage : modèle IS-Net (téléchargé à la première utilisation puis vérifié) exécuté
# par ONNX Runtime, chargé à la demande depuis la bibliothèque officielle embarquée
# (npm run fetch:onnxruntime) : l'exécutable n'en dépend pas pour démarrer.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-17"] }
ureq = "3"
sha2 = "0.11"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tauri-winrt-notification = "0.8.1"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.2"
