# Construit les installeurs Windows (NSIS) et Linux (AppImage).
# Lancé à chaque push sur main, sur les PR, et à la main (onglet Actions).
# Un tag v* publie en plus une release brouillon avec les deux installeurs, leurs
# signatures et le manifeste des mises à jour (latest.json), lu par Morph une fois la
# release publiée.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundle: appimage
            artifact: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
          # Lecture audio/vidéo dans les éditeurs : GStreamer embarqué dans l'AppImage
          # (bundle.linux.appimage.bundleMediaFramework) : seulement les plugins, les paquets
          # -dev (inutiles ici) sont en conflit avec libunwind sur les runners 22.04.
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run fetch:ffmpeg
      - run: npm run fetch:onnxruntime
      - run: npm run fetch:pandoc
      - run: npm run fetch:pdfium

      - name: Tests du moteur
        working-directory: src-tauri
        run: cargo test --release

      # Signature des mises à jour : clé en secret du dépôt. Sans elle (PR d'un fork…),
      # les installeurs sont construits sans fichiers de mise à jour.
      - name: Installeur
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles ${{ matrix.bundle }}
          else
            echo "::warning::Clé de signature absente : installeur sans mise à jour signée"
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            npx tauri build --bundles ${{ matrix.bundle }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: morph-${{ matrix.bundle }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sig
          if-no-files-found: error

      - name: Release brouillon
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "Morph ${GITHUB_REF_NAME#v}" --notes-file "$notes" \
            || true
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.artifact }} ${{ matrix.artifact }}.sig --clobber

  # Manifeste des mises à jour, une fois les deux installeurs signés dans la release.
  updater:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: latest.json
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir sigs
          node scripts/updater-json.mjs "$GITHUB_REF_NAME" sigs > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
