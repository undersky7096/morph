# Construit les installeurs Windows (NSIS) et Linux (AppImage).
# Lancé à chaque push sur main, sur les PR, et à la main (onglet Actions).
# Un tag v* publie en plus une release brouillon avec les deux installeurs.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundle: appimage
            artifact: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run fetch:ffmpeg

      - name: Tests du moteur
        working-directory: src-tauri
        run: cargo test --release

      - name: Installeur
        run: npx tauri build --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: morph-${{ matrix.bundle }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Release brouillon
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "Morph ${GITHUB_REF_NAME#v}" --notes "" \
            || true
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.artifact }} --clobber
